name: CI

# Se ejecuta en cada push (a cualquier rama) y también se puede lanzar a mano desde la pestaña Actions.
on:
  push:
  workflow_dispatch:

# Permisos mínimos: el pipeline solo necesita leer el código.
permissions:
  contents: read

# Si llega un push nuevo a la misma rama mientras hay una ejecución en curso, se cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROYECTO_PRUEBAS: PeliculasAPI.Tests/PeliculasAPI.Tests.csproj

jobs:
  compilar-y-probar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.PROYECTO_PRUEBAS }}

      # Compila el proyecto de pruebas y, con él, la API (es una referencia de proyecto).
      - name: Compilar
        run: dotnet build ${{ env.PROYECTO_PRUEBAS }} --configuration Release --no-restore

      - name: Pruebas unitarias
        run: >
          dotnet test ${{ env.PROYECTO_PRUEBAS }}
          --configuration Release --no-build
          --filter "FullyQualifiedName~PeliculasAPI.Tests.Unit"
          --logger "trx;LogFileName=unitarias.trx"
          --results-directory ./resultados-pruebas

      - name: Pruebas de integración
        run: >
          dotnet test ${{ env.PROYECTO_PRUEBAS }}
          --configuration Release --no-build
          --filter "FullyQualifiedName~PeliculasAPI.Tests.Integration"
          --logger "trx;LogFileName=integracion.trx"
          --results-directory ./resultados-pruebas

      # Se sube aunque las pruebas fallen, para poder revisar el detalle.
      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: resultados-pruebas/*.trx
          if-no-files-found: ignore
          retention-days: 14
